workflows:
  clubhouse-links:
    name: Clubhouse Links App

    integrations:
      app_store_connect: Codemagic

    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.clubhouselinks.app


    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          xcodegen generate

      - name: Set up code signing
        script: |
          xcode-project use-profiles --warn-only

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "ClubhouseLinks.xcodeproj" \
            --scheme "ClubhouseResident" \
            --archive-flags="-allowProvisioningUpdates" \
            --disable-xcpretty \
            --log-stream stdout

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration