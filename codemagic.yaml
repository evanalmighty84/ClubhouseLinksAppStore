workflows:
  clubhouse-resident:
    name: Clubhouse Resident App

    environment:
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          xcodegen generate

      - name: Build iOS app
        script: |
          xcodebuild \
            -project ClubhouseResident.xcodeproj \
            -scheme ClubhouseResident \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            build