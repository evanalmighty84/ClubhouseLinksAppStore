workflows:
  clubhouse-resident:
    name: Clubhouse Resident App

    integrations:
      app_store_connect: Codemagic

    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.clubhouselinks.resident

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          xcodegen generate

      - name: Set up code signing
        script: |
          xcode-project use-profiles --warn-only

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "ClubhouseResident.xcodeproj" \
            --scheme "ClubhouseResident" \
            --archive-flags="-allowProvisioningUpdates" \
            --disable-xcpretty \
            --log-stream stdout

      - name: Publish to App Store Connect
        script: |
          app-store-connect publish \
            --path "$(find build/ios/ipa -name '*.ipa' | head -n 1)" \
            --apple-id 6778204176

    artifacts:
      - build/ios/ipa/*.ipa