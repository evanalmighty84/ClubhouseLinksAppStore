name: ClubhouseResident

options:
  bundleIdPrefix: com.clubhouselinks
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.clubhouselinks.resident
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    DEVELOPMENT_TEAM: XXXXXXXXXX
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"

targets:
  ClubhouseResident:
    type: application
    platform: iOS
    sources:
      - path: ClubhouseResident/Sources
    resources:
      - path: ClubhouseResident/Assets.xcassets
    info:
      path: ClubhouseResident/Info.plist
    settings:
      base:
        INFOPLIST_FILE: ClubhouseResident/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon